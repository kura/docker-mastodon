worker_processes auto;

events {}

http {
    resolver 1.1.1.1 ipv6=off valid=30s;

    server {
        listen 80;

        set $origin status.kura.gg;
        set $page_slug cyberpsychosis;

        server_tokens off;

        gzip on;
        gzip_proxied any;
        gzip_types application/json application/javascript text/css image/svg+xml;

        proxy_http_version 1.1;
        proxy_set_header Host $origin;
        proxy_set_header Accept-Encoding "";

        proxy_ssl_server_name on;
        proxy_ssl_name $origin;

        proxy_redirect https://$origin/ /;

        proxy_hide_header Via;
        proxy_hide_header Fly-Request-Id;

        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter "$origin" "$host";
        sub_filter "/status/$page_slug" "/";

        location = / {
            proxy_pass https://$origin/status/$page_slug;
        }

        location = /api/entry-page {
            default_type application/json;
            return 200 '{"type":"statusPageMatchedDomain","statusPageSlug":"$page_slug"}';
        }

        location ~ ^/api/status-page/(heartbeat|rss)/ {
            proxy_pass https://$origin/api/status-page/$1/$page_slug;
        }

        location ~ ^/api/status-page/[^/]+/(.+)$ {
            proxy_pass https://$origin/api/status-page/$page_slug/$1$is_args$args;
        }

        location ~ ^/api/status-page/ {
            proxy_pass https://$origin/api/status-page/$page_slug;
        }

        location ~ ^/((assets|css|img|upload|api/badge)/|(icon\.svg|favicon\.ico|serviceWorker\.js)$) {
            proxy_pass https://$origin$request_uri;
        }

        location / {
            return 302 /;
        }
    }
}
